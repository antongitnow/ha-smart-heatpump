# Smart Heatpump Controller — Lovelace dashboard cards
#
# HOW TO ADD
# 1. Open Home Assistant → your dashboard → Edit (pencil icon)
# 2. Click "+ Add Card" → "Manual" (scroll to bottom)
# 3. Paste ONE of the cards below into the card editor
# 4. Click Save
#
# The solar boost tuner card is served by the integration itself; it finds
# its entities automatically. The settings card below uses the default
# entity names — if yours differ (Settings → Devices & services → Smart
# Heatpump Controller), update the references.

# --------------------------------------------------------------------------
# Solar boost tuner — grid power with draggable thresholds and a replay
# --------------------------------------------------------------------------

